<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Ten tren tab trinh duyet. KHONG doi productName trong Unity: cache du lieu
       va thu muc luu cua nguoi choi tinh theo ten ay - doi la mat het. -->
  <title>Ác Quỷ Trở Lại</title>
  <!-- Nap truoc font va anh tieu de: man cho la thu dau tien nguoi choi thay -->
  <link rel="preload" href="TemplateData/Inter-Regular.ttf?v=1" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="TemplateData/tieude.png?v=d284b21c24" as="image">
  <style>
    /* FONT CO DU DAU TIENG VIET, di kem trang (khong dua vao font cua may):
       Inter (SIL OFL, TemplateData/Inter-LICENSE.txt) - da doc cmap, du 134 chu
       co dau. "block": chua nap xong thi an chu (toi da ~3 s) chu khong ve bang
       font khac roi nhay sang. */
    @font-face {
      font-family: "InterViet";
      src: url("TemplateData/Inter-Regular.ttf?v=1") format("truetype");
      font-weight: 400; font-style: normal; font-display: block;
    }
    /* Ban mau cua Unity dat canh 960x600 co dinh o goc man hinh. Dien thoai
       moi la nen tang chinh cua game nay, nen canvas phai lap day man hinh -
       ca tren may tinh lan tren dien thoai. */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #07070a;
      /* Chan viec cham hai lan de phong to, va chan keo de tai lai trang -
       hai thao tac nay pha hong dieu khien cam ung trong game */
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      overscroll-behavior: none;
    }
    #o-game { position: fixed; inset: 0; }
    #unity-canvas {
      width: 100%; height: 100%;
      display: block;
      background: #07070a;
    }

    /* Man cho trong luc tai. Ban WebGL nang nen nguoi choi phai doi that -
       khong co gi te hon mot man hinh den khong noi gi. */
    #man-tai {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #07070a;
      color: #b9b9c0;
      font: 15px/1.6 "InterViet", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      z-index: 10;
    }
    /* TEN GAME = ANH dung san (CongCu/TieuDe/sinh_tieu_de.py, font Grenze
       Gotisch) - CUNG FILE voi man trong game (Resources/GiaoDien/TieuDe.png),
       nen hai noi giong het, dau nam san trong anh. Chap chon do sang 0,62-1,0
       nhu GiaoDien.TieuDeGame. */
    #ten-game {
      display: block;
      width: min(88vw, 640px); height: auto;
      margin-bottom: 14px;
      animation: chap-chon 2.7s infinite;
    }
    @keyframes chap-chon {
      0%   { filter: brightness(1); }
      9%   { filter: brightness(.78); }
      14%  { filter: brightness(.95); }
      31%  { filter: brightness(.70); }
      38%  { filter: brightness(1); }
      55%  { filter: brightness(.86); }
      61%  { filter: brightness(.64); }
      68%  { filter: brightness(.97); }
      84%  { filter: brightness(.80); }
      100% { filter: brightness(1); }
    }
    #tac-gia {
      margin-top: 6px;
      font-size: 13px; letter-spacing: .08em;
      color: #8a8490;
    }
    #vach { width: min(74vw, 420px); height: 6px; background: #23232b; border-radius: 3px; overflow: hidden; }
    #vach-day { width: 0%; height: 100%; background: linear-gradient(90deg, #8c1a10, #ff5a2b); transition: width .2s; }
    #so-phan-tram { margin-top: 12px; font-variant-numeric: tabular-nums; }
    #loi-nang { color: #ff6b60; max-width: 80vw; text-align: center; margin-top: 18px; }
  </style>
</head>
<body>

<div id="o-game">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="man-tai">
  <img id="ten-game" src="TemplateData/tieude.png?v=d284b21c24" alt="Ác Quỷ Trở Lại">
  <div id="vach"><div id="vach-day"></div></div>
  <div id="so-phan-tram">Đang tải... 0%</div>
  <div id="tac-gia">Tác giả: PHẠM MINH QUÂN</div>
  <div id="loi-nang"></div>
</div>

<script>
  var canvas = document.querySelector("#unity-canvas");
  var manTai = document.querySelector("#man-tai");
  var vachDay = document.querySelector("#vach-day");
  var soPhanTram = document.querySelector("#so-phan-tram");
  var oLoi = document.querySelector("#loi-nang");

  var buildUrl = "Build";
  var config = {
    arguments: [],
    dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
    frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
    codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
    streamingAssetsUrl: "StreamingAssets",
    companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
    productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
    productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},

    // CACHE THEO MA PHIEN BAN. File nao co "?v=<ma>" (ma MD5 cua chinh noi
    // dung file, menu 29 tu gan) thi duoi duong dan do noi dung khong bao gio
    // doi -> "immutable": lan sau Unity lay thang tu Cache Storage, khong hoi
    // mang mot byte nao. Ban moi = ma moi = duong dan moi, nen ma game (.wasm)
    // va du lieu (.data) luon cung mot ban - khong the ghep ma cu voi du lieu
    // moi (loi sap luc tai truoc day).
    //
    // Vi sao phai tu lam: mac dinh Unity de .data la "must-revalidate" - hoi
    // lai bang If-Modified-Since va cho 304. Nhung Firebase Hosting KHONG BAO
    // GIO tra 304 cho file "no-cache": CDN khong giu file do, moi lan deu ve
    // may goc, ma may goc tra 200 kem ca file. Do 11/09/2026: moi lan vao
    // trang tai lai 165 921 735 byte du Cache Storage da co dung ban do.
    //
    // productVersion cung duoc menu 29 gan ma cua .data: Unity tu xoa moi muc
    // trong cache khac productVersion ngay luc khoi dong (TRUOC khi tai), nen
    // ban cu 166 MB khong don lai trong may nguoi choi sau moi lan cap nhat.
    // File khong co ma (ban build chua qua menu 29) thi giu cach cua Unity.
    cacheControl: function (url) {
      if (/[?&]v=[0-9a-f]+$/.test(url)) return "immutable";
      return url == config.dataUrl ? "must-revalidate" : "no-store";
    },

    showBanner: function (msg, type) {
      if (type === "error") oLoi.textContent = msg;
    },
  };

  // DO PHAN GIAI THEO CAI DAT CUA NGUOI CHOI (Cai dat > Giao dien trong game).
  //
  // Unity chi doc devicePixelRatio MOT LAN, luc khoi dong - nen chon xong game
  // phai tai lai trang. Khoa va bang he so phai KHOP voi CaiDatDoHoa.cs:
  //   0 = Cao 100%, 1 = Trung binh 75%, 2 = Yeu 50% (theo moi chieu).
  // Doc loi (trinh duyet cam luu) thi de nguyen - tuc la muc Cao nhu cu.
  var HE_SO_PHAN_GIAI = [1, 0.75, 0.5];
  try {
    var mucDoHoa = parseInt(window.localStorage.getItem("diablo25d.mucDoHoa"), 10);
    if (mucDoHoa >= 1 && mucDoHoa <= 2)
      config.devicePixelRatio = (window.devicePixelRatio || 1) * HE_SO_PHAN_GIAI[mucDoHoa];
  } catch (e) { }

  var script = document.createElement("script");
  script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
  script.onload = function () {
    createUnityInstance(canvas, config, function (tienDo) {
      var p = Math.round(tienDo * 100);
      vachDay.style.width = p + "%";
      soPhanTram.textContent = "Đang tải... " + p + "%";
    }).then(function () {
      manTai.style.display = "none";
    }).catch(function (loi) {
      oLoi.textContent = "Không chạy được: " + loi;
    });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
