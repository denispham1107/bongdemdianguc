<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diablo 2.5D — Quản trị</title>
<link rel="stylesheet" href="css/chung.css">
</head>
<body class="nen-toi">

<div class="khung-giua">
  <h1 class="tieu-de">DIABLO 2.5D</h1>
  <p class="phu-de">Trang quản trị — dành cho người quản lý tài khoản.<br><span style="font-size:12px">Người chơi đăng ký và chơi ngay trong game, không cần vào đây.</span></p>

  <div class="the">

    <form id="bieuMau" autocomplete="on">
      <label class="nhan">Email
        <input id="oEmail" type="email" required placeholder="ban@email.com" autocomplete="email">
      </label>

      <label class="nhan">Mật khẩu
        <input id="oMatKhau" type="password" required minlength="6" placeholder="Ít nhất 6 ký tự" autocomplete="current-password">
      </label>

      <button id="nutChinh" type="submit" class="nut nut-chinh">ĐĂNG NHẬP</button>
    </form>

    <button id="nutQuenMatKhau" class="nut-chu">Quên mật khẩu?</button>
    <p id="oBao" class="bao" role="status" aria-live="polite"></p>
  </div>
</div>

<script type="module">
import { dangNhap, theoDoiDangNhap, guiEmailDatLaiMatKhau, laAdmin } from "./js/taikhoan.js";
import { dichLoi } from "./js/ketnoi.js";

const oEmail   = document.getElementById("oEmail");
const oMatKhau = document.getElementById("oMatKhau");
const nutChinh = document.getElementById("nutChinh");
const bieuMau  = document.getElementById("bieuMau");
const oBao     = document.getElementById("oBao");

// Dang tu tay bam nut hay khong. Firebase ban onAuthStateChanged ngay khi
// dang nhap xong, som hon ca luc kiem tra quyen admin - de listener duoi
// trang tu chuyen huong luc do thi buoc kiem tra bi cat ngang.
let dangTuXuLy = false;

function bao(chu, laLoi) {
  oBao.textContent = chu;
  oBao.className = "bao " + (laLoi ? "bao-loi" : "bao-ok");
}

bieuMau.onsubmit = async (e) => {
  e.preventDefault();
  dangTuXuLy = true;
  nutChinh.disabled = true;
  bao("Đang đăng nhập…", false);
  try {
    const nguoiDung = await dangNhap(oEmail.value.trim(), oMatKhau.value);
    if (!(await laAdmin(nguoiDung.uid))) {
      bao("Tài khoản này không phải quản trị viên.", true);
      nutChinh.disabled = false;
      dangTuXuLy = false;
      return;
    }
    location.href = "admin/";
  } catch (loi) {
    bao(dichLoi(loi), true);
    nutChinh.disabled = false;
    dangTuXuLy = false;
  }
};

document.getElementById("nutQuenMatKhau").onclick = async () => {
  const email = oEmail.value.trim();
  if (!email) { bao("Hãy điền email trước, rồi bấm lại nút này.", true); return; }
  try {
    await guiEmailDatLaiMatKhau(email);
    bao("Đã gửi thư đặt lại mật khẩu tới " + email, false);
  } catch (loi) { bao(dichLoi(loi), true); }
};

// Da dang nhap san va dung la admin thi vao thang bang quan tri
theoDoiDangNhap(async (nguoiDung) => {
  if (dangTuXuLy || !nguoiDung) return;
  if (await laAdmin(nguoiDung.uid)) location.href = "admin/";
});
</script>
</body>
</html>
